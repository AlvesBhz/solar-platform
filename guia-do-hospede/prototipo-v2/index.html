<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--c-s100);font-family:var(--font-sans);font-size:15px;line-height:1.5;color:var(--fg-1)}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
/* temas: claro e escuro (tokens do Design System) */
.app{--bg:var(--c-cream);--surf:#fff;--soft:var(--c-s100);--ink:var(--c-s900);--ink2:var(--c-s600);--ink3:var(--c-s500);--line:var(--c-s200);--line2:var(--c-s300);--brand:var(--c-pine);--onbrand:#fff;--alert-bg:#fef2f2;--alert-bd:#f0b8b8;--alert:var(--c-error)}
.app.dark{--bg:var(--c-pine-deep);--surf:var(--c-pine);--soft:rgba(255,255,255,.08);--ink:#fff;--ink2:rgba(255,255,255,.78);--ink3:rgba(255,255,255,.58);--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.22);--brand:#fff;--onbrand:var(--c-pine-deep);--alert-bg:#fff;--alert-bd:#fff;--alert:var(--c-error)}
.app{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){.app{height:min(900px,96dvh);margin-top:2dvh;border-radius:32px;box-shadow:var(--shadow-xl);border:1px solid var(--line)}}
.top{display:flex;align-items:center;gap:2px;padding:12px 10px 8px 12px;min-height:60px}
.top .ttl{flex:1;font-family:var(--font-serif);font-weight:500;font-size:24px;letter-spacing:-.01em;line-height:1.1;padding-left:4px;min-width:0}
.ib{width:44px;height:44px;flex:none;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--brand)}
.ib:active{background:var(--soft)}
main{flex:1;overflow-y:auto;padding:4px 16px 120px;zoom:var(--z,1)}
main::-webkit-scrollbar{width:0}
.sec{margin-top:22px}
.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
h2.h{font-family:var(--font-serif);font-weight:500;font-size:30px;line-height:1.05;letter-spacing:-.02em}
p.sub{color:var(--ink2);font-size:14px;margin-top:6px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;box-shadow:var(--shadow-sm)}
.card+.card{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:112px;padding:16px;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);transition:transform var(--dur-fast)}
.tile:active{transform:scale(.98)}
.ic{flex:none;display:grid;place-items:center;background:var(--soft);color:var(--brand)}
.tile .ic{width:44px;height:44px;border-radius:var(--r-lg)}
.tile b{font-weight:600;font-size:15px;line-height:1.2}
.tile small{display:block;font-weight:400;font-size:13px;color:var(--ink3);margin-top:2px}
.tile.alert{background:var(--c-error);border-color:var(--c-error);color:#fff}
.tile.alert .ic{background:rgba(255,255,255,.16);color:#fff}
.tile.alert small{color:rgba(255,255,255,.8)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-xl);text-align:left;min-height:64px}
.row+.row{margin-top:10px}
.row .ic{width:40px;height:40px;border-radius:var(--r-md)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600}
.row .tx span{display:block;font-size:14px;color:var(--ink3)}
.row .tx span.pend{display:inline-block;font-size:11px;color:var(--c-warning)}
.row .go{color:var(--ink3)}
.hero{border-radius:var(--r-2xl);padding:22px;color:#fff;background:linear-gradient(160deg,var(--c-pine-deep),var(--c-pine) 55%,var(--c-pine-mid));border:1px solid var(--line)}
.hero .gr{font-family:var(--font-serif);font-size:32px;font-weight:500;line-height:1}
.hero p{color:rgba(255,255,255,.78);font-size:14px;margin-top:6px}
.hero .times{display:flex;gap:10px;margin-top:18px}
.hero .t{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--r-lg);padding:10px 12px}
.hero .t small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.hero .t b{font-family:var(--font-mono);font-size:18px;font-weight:500}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--font-mono);font-weight:600;word-break:break-all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r-pill);background:var(--brand);color:var(--onbrand);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-align:center;transition:transform var(--dur-base),opacity var(--dur-base)}
.btn:active{transform:translateY(1px);opacity:.88}
.btn.out{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.red{background:var(--c-error);color:#fff}
.btn.full{width:100%}
.btns{display:grid;gap:10px;margin-top:14px}
.btns.two{grid-template-columns:1fr 1fr}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:var(--r-pill);background:var(--surf);border:1px solid var(--line2);font-size:14px;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:var(--r-pill);padding:4px;margin-top:14px}
.seg button{min-height:40px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--ink3)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--shadow-sm)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r-pill);border:1px solid}
.b-leve{color:var(--c-available);border-color:#a7d9c5;background:#ecfdf5}
.b-media{color:var(--c-warning);border-color:#f3d9a6;background:var(--c-warning-bg)}
.b-exig{color:var(--c-error);border-color:#f0b8b8;background:#fef2f2}
.meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:14px;color:var(--ink2)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.place{width:100%;text-align:left;display:block}
.place h3{font-family:var(--font-serif);font-size:22px;font-weight:500;line-height:1.1;margin:8px 0 4px}
.place p{font-size:14px;color:var(--ink2)}
.pend{display:inline-block;font-size:11px;font-weight:600;color:var(--c-warning);background:var(--c-warning-bg);border:1px solid #f3d9a6;border-radius:var(--r-sm);padding:1px 7px}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:var(--surf);border:1px solid var(--line2);border-radius:var(--r-pill);color:var(--ink3)}
.search input{flex:1;outline:0;font-size:16px;color:var(--ink);min-width:0}
.plan,.map{margin-top:14px;aspect-ratio:16/10;border-radius:var(--r-xl);border:1.5px dashed var(--line2);background:var(--soft);display:grid;place-items:center;text-align:center;color:var(--ink3);font-size:14px;padding:16px}
.map{aspect-ratio:4/5}
.photo{aspect-ratio:16/9;border-radius:var(--r-xl);background:var(--soft);border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--ink3);font-size:13px;margin-bottom:14px}
.steps{counter-reset:s;list-style:none;margin-top:12px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;padding:10px 0;font-size:17px;line-height:1.35}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:var(--r-pill);background:var(--brand);color:var(--onbrand);font-weight:600;font-size:14px;display:grid;place-items:center}
.call{background:var(--alert-bg);border:1px solid var(--alert-bd);color:var(--alert);border-radius:var(--r-lg);padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.dont{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--c-error);border-radius:var(--r-lg);padding:14px 16px;margin-top:14px}
.dont b{display:flex;align-items:center;gap:8px;color:var(--c-error);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.app.dark .dont b{color:#ffb4b4}
.dont li{margin-left:18px;font-size:15px;line-height:1.4;margin-top:4px}
.fixbar{position:absolute;left:0;right:0;bottom:78px;padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:4}
.call-row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-xl);background:var(--c-error);color:#fff;min-height:68px}
.call-row+.call-row{margin-top:10px}
.call-row.s{background:#fff;color:var(--c-error);border:1px solid #f0b8b8}
.call-row b{display:block;font-size:20px;font-family:var(--font-mono)}
.call-row span{font-size:14px}
.disc{margin-top:18px;font-size:13px;color:var(--ink3);line-height:1.5;display:flex;gap:8px}
.check{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 16px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-xl);text-align:left}
.check+.check{margin-top:10px}
.check .bx{flex:none;width:26px;height:26px;border-radius:var(--r-sm);border:2px solid var(--line2);display:grid;place-items:center;color:transparent}
.check.on .bx{background:var(--c-available);border-color:var(--c-available);color:#fff}
.check.on .nm{color:var(--ink3);text-decoration:line-through}
.hint{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surf);font-size:14px;color:var(--ink2);margin-top:12px}
.hint button{margin-left:auto;color:var(--ink3);width:36px;height:36px}
nav.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;padding:6px 8px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:12px;font-weight:500;border-radius:var(--r-lg)}
.tab.on{color:var(--brand);font-weight:700}
.sos{position:absolute;right:16px;bottom:94px;z-index:5;display:flex;align-items:center;gap:8px;height:52px;padding:0 20px;border-radius:var(--r-pill);background:var(--c-error);color:#fff;font-weight:700;font-size:14px;letter-spacing:.12em;box-shadow:var(--shadow-lg)}
.sos:active{transform:scale(.97)}
.hasfix .sos,.noSos .sos{display:none}
.toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,20px);opacity:0;background:var(--c-pine-deep);color:#fff;padding:12px 18px;border-radius:var(--r-pill);font-size:14px;pointer-events:none;transition:all var(--dur-base);z-index:40;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* menu (idioma, texto, tema) */
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:25;opacity:0;visibility:hidden;transition:opacity var(--dur-base)}
.sheetbg.on{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:var(--r-2xl) var(--r-2xl) 0 0;padding:20px 20px 28px;z-index:26;transform:translateY(105%);transition:transform 320ms var(--ease-spring)}
.sheet.on{transform:none}
.sheet h4{font-family:var(--font-serif);font-size:24px;font-weight:500;margin-bottom:6px}
.opt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:8px}
.opt button{min-height:48px;border-radius:var(--r-lg);border:1px solid var(--line2);background:var(--surf);font-weight:600;font-size:14px}
.opt button.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.welcome{position:absolute;inset:0;z-index:30;background:linear-gradient(170deg,var(--c-pine-deep),var(--c-pine) 60%,var(--c-pine-mid));color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:36px 26px 32px;transition:opacity var(--dur-slow),visibility var(--dur-slow);overflow-y:auto}
.welcome.off{opacity:0;visibility:hidden}
.welcome .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-size:24px;font-weight:500}
.welcome h1{font-family:var(--font-serif);font-weight:500;font-size:50px;line-height:.92;letter-spacing:-.03em;margin-top:30px}
.welcome h1 em{font-family:var(--font-italic);font-weight:400}
.welcome p{color:rgba(255,255,255,.78);margin-top:12px;max-width:32ch}
.welcome .fields{display:grid;gap:10px;margin-top:22px}
.welcome input{height:52px;border-radius:var(--r-pill);padding:0 20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:16px;outline:0}
.welcome input::placeholder{color:rgba(255,255,255,.6)}
.welcome .btn{background:#fff;color:var(--c-pine-deep)}
.welcome .skip{color:rgba(255,255,255,.75);min-height:44px;font-size:14px;margin-top:6px}
.wl{display:flex;gap:6px}
.wl button{font-size:12px;font-weight:600;letter-spacing:.08em;padding:8px 12px;border-radius:var(--r-pill);color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.25)}
.wl button.on{background:#fff;color:var(--c-pine-deep);border-color:#fff}
.fade{animation:fadeUp var(--dur-slow) var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
.proto{margin-top:26px;font-size:12px;color:var(--ink3);text-align:center}
</style>
</head>

 steps:[tri('Pare, respire e não se separe do grupo.','Stop, breathe and stay with the group.','Detente, respira y no te separes del grupo.'),tri('Ligue 193 se houver sinal, ou envie sua localização.','Call 193 if there is signal, or send your location.','Llama al 193 si hay señal, o envía tu ubicación.'),tri('Volte pelo caminho conhecido só se tiver certeza.','Go back the known way only if sure.','Vuelve por el camino conocido solo si estás seguro.'),tri('Fique em lugar visível e agasalhado; economize água e bateria.','Stay somewhere visible and warm; save water and battery.','Quédate en un lugar visible y abrigado; ahorra agua y batería.')],

/* ───────── estado ───────── */
const S={lang:'pt',z:1,dark:false,name:'',chalet:'',stack:['home'],filt:'all',cat:'all',mapTab:false,out:{},hint:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('gp')||'{}'))}catch(e){}
S.stack=['home'];S.mapTab=false;
const save=()=>{try{localStorage.setItem('gp',JSON.stringify({lang:S.lang,z:S.z,dark:S.dark,name:S.name,chalet:S.chalet,hint:S.hint}))}catch(e){}};
const $=s=>document.querySelector(s),t=k=>L[S.lang][k]??k;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=(n,w=24)=>`<iconify-icon icon="${n}" width="${w}"></iconify-icon>`;
const pend=()=>`<span class="pend">[${S.lang==='en'?'TO CONFIRM':S.lang==='es'?'POR CONFIRMAR':'CONFIRMAR'}]</span>`;
const chev=`<span class="go">${ico('solar:alt-arrow-right-linear',20)}</span>`;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function copy(x,m){try{navigator.clipboard.writeText(x)}catch(e){};toast(m)}
function go(id,arg){S.stack.push(arg!==undefined?id+':'+arg:id);render()}
function back(){if(S.stack.length>1)S.stack.pop();render()}
function tab(x){S.stack=[x];render()}
const wa=m=>`https://wa.me/${P.whatsapp}${m?'?text='+encodeURIComponent(m):''}`;
const mapsUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+' Lapinha da Serra');
const metaH=p=>`<div class="meta">${(p.meta||[]).map(m=>`<span>${ico(m.icon,16)}${esc(m.text)}</span>`).join('')}</div>`;
const diffB=p=>{const m={leve:['b-leve','solar:check-circle-linear','easy'],media:['b-media','solar:danger-circle-linear','mid'],exigente:['b-exig','solar:danger-triangle-linear','hard']}[p.diff];return m?`<span class="badge ${m[0]}">${ico(m[1],14)}${t(m[2])}</span>`:''};

const V={};
V.home=()=>{const h=new Date().getHours(),g=h<12?'gm':h<18?'gt':'gn',sug=PL.serraPerto[0];

 <div class="sec"><div class="eyebrow">${t('quick')}</div><div class="grid2">
  <button class="tile" onclick="go('wifi')"><span class="ic">${ico('solar:wi-fi-router-linear')}</span><b>${t('wifi')}<small>${GUIDE.wifi.network}</small></b></button>
  <button class="tile" onclick="go('sabores')"><span class="ic">${ico('solar:cup-hot-linear')}</span><b>${t('cafe')}<small>${t('tSab')}</small></b></button>

  <div class="card"><div style="display:flex;gap:12px;align-items:center">${ico('solar:sun-2-linear',28)}<div><b>${t('weather')}</b><div class="sub" style="margin:0">${pend()}</div></div></div></div>
  <button class="row" style="margin-top:10px" onclick="go('serrad',${PASS.indexOf(sug)})"><span class="ic">${ico('solar:mountains-linear')}</span><span class="tx"><span>${t('sugg')}</span><b>${esc(sug.title)}</b></span>${chev}</button>
  <button class="row" onclick="go('digital')"><span class="ic">${ico('solar:documents-linear')}</span><span class="tx"><b>${t('digital')}</b><span>${t('digitalS')}</span></span>${chev}</button></div>
 ${S.hint?`<div class="hint">${ico('solar:download-minimalistic-linear',24)}<span>${t('addHome')}</span><button onclick="S.hint=false;save();render()" aria-label="${t('close')}">${ico('solar:close-circle-linear',22)}</button></div>`:''}
 <p class="proto">${t('proto')}</p>`};

V.where=()=>{const cats=['all','cSeg','cConf','cCoz','cLaz'];
 return `<label class="search">${ico('solar:magnifer-linear',22)}<input id="q" type="search" placeholder="${t('q')}" oninput="fillWhere()"/></label>
 <div class="chips" style="margin-top:12px">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()">${c==='all'?t('all'):t(c)}</button>`).join('')}</div>
 <div class="plan">${t('plan')}</div><div class="sec" id="res" style="margin-top:14px"></div>`};
function fillWhere(){const q=($('#q')?.value||'').toLowerCase();
 const r=ITEMS.map((x,i)=>[x,i]).filter(([x])=>(S.cat==='all'||x[2]===S.cat)&&t(x[0]).toLowerCase().includes(q));
 $('#res').innerHTML=r.length?r.map(([x,i])=>`<button class="row" onclick="go('item',${i})"><span class="ic">${ico(x[1])}</span><span class="tx"><b>${t(x[0])}</b><span>${t('loc')}: ${pend()}</span></span>${chev}</button>`).join(''):`<p class="sub">${t('noRes')}</p>`}
V.item=a=>{const x=ITEMS[a];return `<div class="photo">${t('photo')} ${pend()}</div><div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="ic" style="width:44px;height:44px;border-radius:var(--r-lg)">${ico(x[1])}</span><b style="font-size:18px">${t(x[0])}</b></div><p class="sub" style="margin-top:12px">${t('loc')}: ${pend()}</p></div>`};

V.auto=()=>AUTO.map((x,i)=>`<button class="row" onclick="go('autod',${i})"><span class="ic">${ico(x[1])}</span><span class="tx"><b>${t(x[0])}</b><span>${pend()}</span></span>${chev}</button>`).join('');
V.autod=a=>{const x=AUTO[a];return `<div class="photo">${t('photo')} ${pend()}</div><div class="eyebrow">${t('howto')}</div>
 <ol class="steps">${[1,2,3].map(()=>`<li>${pend()}</li>`).join('')}</ol>
 <div class="card sec"><b>${t('notwork')}</b><div class="btns"><a class="btn out full" href="${wa()}" target="_blank" rel="noopener">${ico('mdi:whatsapp',20)}${t('talkHouse')}</a></div></div>`};
const stepsPage=l=>l.map(x=>`<div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="ic" style="width:44px;height:44px;border-radius:var(--r-lg)">${ico(x[1])}</span><b style="font-size:17px">${t(x[0])}</b></div><ol class="steps">${[1,2,3].map(()=>`<li style="font-size:16px">${pend()}</li>`).join('')}</ol></div>`).join('');
V.equip=()=>stepsPage(EQUIP);
V.conv=()=>CONV.map(x=>`<div class="row"><span class="ic">${ico(x[1])}</span><span class="tx"><b>${t(x[0])}</b><span>${pend()}</span></span></div>`).join('');

V.serra=()=>{const F=S.filt;let list=PASS.map((p,i)=>[p,i]);
 if(F==='near')list=list.filter(([p])=>PL.serraPerto.includes(p));else if(F==='kids')list=list.filter(([p])=>p.diff==='leve');else if(F!=='all')list=[];
 const chip=(k,l)=>`<button class="chip ${F===k?'on':''}" onclick="S.filt='${k}';render()">${l}</button>`;
 return `<h2 class="h">${t('serraT')}</h2>
 <div class="seg"><button class="${S.mapTab?'':'on'}" onclick="S.mapTab=false;render()">${t('list')}</button><button class="${S.mapTab?'on':''}" onclick="S.mapTab=true;render()">${t('map')}</button></div>
 ${S.mapTab?`<div class="map">${t('mapPh')}</div>`:`<div class="chips" style="margin-top:14px">${chip('all',t('all'))}${chip('near',t('near'))}${chip('kids',t('kids'))}${chip('pet',t('pet'))}${chip('rain',t('rain'))}${chip('eve',t('eve'))}</div>
 <div class="sec" style="margin-top:12px">${list.length?list.map(([p,i])=>`<button class="card place" onclick="go('serrad',${i})">${diffB(p)}<h3>${esc(p.title)}</h3><p>${esc(p.text)}</p>${metaH(p)}</button>`).join(''):`<p class="sub">${t('noTag')} ${pend()}</p>`}</div>`}`};

 <div class="btns"><a class="btn full" href="${wa()}" target="_blank" rel="noopener">${ico('mdi:whatsapp',20)}WhatsApp</a><a class="btn out full" href="tel:${P.phone}">${ico('solar:phone-calling-linear',20)}${t('call')}</a></div></div>`;

V.svc=()=>`<div class="eyebrow">${t('svcT')}</div>${SERV.map(x=>`<div class="row"><span class="ic">${ico(x[1])}</span><span class="tx"><b>${t(x[0])}</b><span>${pend()}</span></span></div>`).join('')}
 <div class="sec"><div class="eyebrow">${t('outT')}</div>${OUT.map(k=>`<button class="check ${S.out[k]?'on':''}" onclick="S.out['${k}']=!S.out['${k}'];render()"><span class="bx">${ico('solar:check-read-linear',18)}</span><span class="nm">${t(k)}</span></button>`).join('')}<p class="sub">${pend()}</p></div>`;

V.emerg=()=>`<p class="sub" style="margin-top:0">${t('emS')}</p><div class="sec" style="margin-top:14px">
 ${GUIDE.emergencyNational.map((e,i)=>`<a class="call-row ${i?'s':''}" href="tel:${e.tel}">${ico(e.icon,28)}<div style="flex:1"><b>${e.tel}</b><span>${e.label}</span></div>${ico('solar:phone-calling-linear',24)}</a>`).join('')}</div>
 <div class="card sec" style="margin-top:18px"><div class="lbl">${t('myAddr')}</div><p style="font-size:17px;font-weight:600;margin-top:4px;line-height:1.35">${esc(P.address)}</p><p class="sub">${t('addrH')}</p>
 <div class="btns"><button class="btn out full" onclick="copy(P.address,t('addrC'))">${ico('solar:copy-linear',20)}${t('cAddr')}</button></div></div>
 <div class="sec"><div class="eyebrow">${t('nearHelp')}</div>${PL.saude.slice(0,2).map(p=>`<div class="card place"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p>${metaH(p)}</div>`).join('')}</div>`;

V.fa=()=>`<p class="sub" style="margin-top:0">${t('faPick')}</p><div class="grid2 sec" style="margin-top:14px">
 ${FA_ORDER.map(k=>`<button class="tile" onclick="${k==='bite'?`go('animal')`:`go('fadet','${k}')`}" style="min-height:104px"><span class="ic">${ico(FA[k].ic)}</span><b>${t(k)}</b></button>`).join('')}</div>
 <p class="disc">${ico('solar:info-circle-linear',18)}<span>${t('disc')}</span></p>`;
V.animal=()=>`<p class="sub" style="margin-top:0">${t('which')}</p><div class="grid2 sec" style="margin-top:14px">${ANIMALS.map(a=>`<button class="tile" onclick="go('fadet','bite')" style="min-height:104px"><span class="ic">${ico(a[1])}</span><b>${t(a[0])}</b></button>`).join('')}</div><p class="disc">${ico('solar:info-circle-linear',18)}<span>${t('unsure')}</span></p>`;
V.fadet=k=>{const d=FA[k],l=S.lang;return `<div class="call">${ico('solar:phone-calling-linear',22)}<span>${t('callIf')}: ${d.call[l]}</span></div>
 <ol class="steps">${d.steps.map(s=>`<li>${s[l]}</li>`).join('')}</ol>
 <div class="dont"><b>${ico('solar:close-circle-linear',18)}${t('dont')}</b><ul>${d.dont.map(s=>`<li>${s[l]}</li>`).join('')}</ul></div>
 <p class="disc">${ico('solar:info-circle-linear',18)}<span>${t('draft')}</span></p>
 <div class="fixbar"><a class="btn red" href="tel:${d.tel}">${ico('solar:phone-calling-linear',20)}${t('call')} ${d.tel}</a><button class="btn out" style="background:var(--bg)" onclick="go('emerg')">${t('myAddr')}</button></div>`};

/* busca global */
V.search=()=>`<label class="search">${ico('solar:magnifer-linear',22)}<input id="gq" type="search" placeholder="${t('srch')}…" oninput="fillSearch()" autofocus/></label><div id="gres" class="sec" style="margin-top:14px"></div>`;
function fillSearch(){const q=($('#gq').value||'').toLowerCase().trim();const out=[];
 const add=(sec,ic,name,fn)=>{if(name.toLowerCase().includes(q))out.push([sec,ic,name,fn])};
 add('tHome','solar:wi-fi-router-linear',t('wifi')+' · '+t('pw'),"go('wifi')");
 add('tHome','solar:documents-linear',t('digital'),"go('digital')");
 ITEMS.forEach((x,i)=>add('tCasa',x[1],t(x[0]),`go('item',${i})`));
 AUTO.forEach((x,i)=>add('tCasa',x[1],t(x[0]),`go('autod',${i})`));
 PASS.forEach((p,i)=>add('tSerra','solar:mountains-linear',p.title,`go('serrad',${i})`));
 REST.forEach(p=>add('tSab','solar:chef-hat-minimalistic-linear',p.title,"go('sabores')"));
 FA_ORDER.forEach(k=>add('tAj',FA[k].ic,t('fa')+' · '+t(k),k==='bite'?"go('animal')":`go('fadet','${k}')`));
 const q2=out.slice(0,40);const secs=['tHome','tCasa','tSerra','tSab','tAj'];
 $('#gres').innerHTML=q?(q2.length?secs.map(s=>{const g=q2.filter(r=>r[0]===s);return g.length?`<div class="eyebrow" style="margin-top:14px">${t(s)}</div>`+g.map(r=>`<button class="row" onclick="${r[3]}"><span class="ic">${ico(r[1])}</span><span class="tx"><b>${esc(r[2])}</b></span>${chev}</button>`).join(''):''}).join(''):`<p class="sub">${t('noRes')}</p>`):''}

/* ───────── cabeçalho, menu e render ───────── */
const TABS=[['home','tHome','solar:home-2-linear'],['casa','tCasa','solar:key-minimalistic-linear'],['serra','tSerra','solar:mountains-linear'],['sabores','tSab','solar:cup-hot-linear'],['ajuda','tAj','solar:lifebuoy-linear']];
const PARENT={wifi:'home',digital:'home',search:'home',where:'casa',item:'casa',auto:'casa',autod:'casa',equip:'casa',conv:'casa',serrad:'serra',emerg:'ajuda',fa:'ajuda',animal:'ajuda',fadet:'ajuda',talk:'ajuda',svc:'ajuda'};
const TT={casa:'tCasa',serra:'tSerra',sabores:'tSab',ajuda:'tAj',wifi:'wifi',digital:'ckT',where:'where',auto:'auto',autod:'auto',equip:'equip',conv:'conv',emerg:'emT',fa:'fa',animal:'bite',talk:'talk',svc:'svc',search:'srch'};
function render(){
  const cur=S.stack[S.stack.length-1],[id,arg]=cur.split(':'),sub=S.stack.length>1;
  const title=id==='fadet'?t(arg):id==='item'?t(ITEMS[arg][0]):id==='serrad'?PASS[arg].title:id==='home'?'Solar do Espinhaço':t(TT[id]);
  $('#top').innerHTML=(sub?`<button class="ib" onclick="back()" aria-label="${t('back')}">${ico('solar:alt-arrow-left-linear',26)}</button>`:`<span class="ib">${ico('solar:leaf-linear',26)}</span>`)
   +`<div class="ttl">${esc(title)}</div>`+(id==='search'?'':`<button class="ib" onclick="go('search')" aria-label="${t('srch')}">${ico('solar:magnifer-linear',24)}</button>`)+`<button class="ib" onclick="menu(true)" aria-label="${t('menuT')}">${ico('solar:menu-dots-linear',26)}</button>`;
  $('#main').innerHTML=V[id](arg);$('#main').scrollTop=0;
  if(id==='where')fillWhere();
  const act=PARENT[id]||id;
  $('#tabs').innerHTML=TABS.map(x=>`<button class="tab ${x[0]===act?'on':''}" onclick="tab('${x[0]}')">${ico(x[2],26)}<span>${t(x[1])}</span></button>`).join('');
  $('#app').classList.toggle('hasfix',id==='fadet');$('#app').classList.toggle('dark',S.dark);
  $('#main').style.setProperty('--z',S.z);document.documentElement.lang={pt:'pt-BR',en:'en',es:'es'}[S.lang];
}
function menu(on){const sh=$('#sheet');
 sh.innerHTML=`<h4>${t('menuT')}</h4><div class="lbl" style="margin-top:14px">${t('lang')}</div><div class="opt">${['pt','en','es'].map(l=>`<button class="${S.lang===l?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}</div>
 <div class="lbl" style="margin-top:16px">${t('txt')}</div><div class="opt">${[[.92,'A−'],[1,'A'],[1.12,'A+'],[1.25,'A++']].map(z=>`<button class="${S.z===z[0]?'on':''}" onclick="S.z=${z[0]};save();render();menu(true)">${z[1]}</button>`).join('')}</div>
 <div class="lbl" style="margin-top:16px">${t('theme')}</div><div class="opt"><button class="${S.dark?'':'on'}" onclick="S.dark=false;save();render();menu(true)">${ico('solar:sun-2-linear',20)} ${t('light')}</button><button class="${S.dark?'on':''}" onclick="S.dark=true;save();render();menu(true)">${ico('solar:moon-stars-linear',20)} ${t('dark')}</button></div>
 <div class="btns"><button class="btn full" onclick="menu(false)">${t('close')}</button></div>`;
 sh.classList.toggle('on',on);$('#sbg').classList.toggle('on',on)}
function setLang(l){S.lang=l;save();welcomeText();render();if($('#sheet').classList.contains('on'))menu(true)}
function welcomeText(){$('#wh').innerHTML=t('wH');$('#wp').textContent=t('wP');$('#enter').textContent=t('enter');$('#skip').textContent=t('skip');
 $('#fn').placeholder=t('nm');$('#fc').placeholder=t('ch');
 $('#wlang').innerHTML=['pt','en','es'].map(l=>`<button class="${l===S.lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}
function enter(save_){if(save_){S.name=$('#fn').value.trim().slice(0,30);S.chalet=$('#fc').value.trim().slice(0,30);save()}$('#welcome').classList.add('off');render()}
$('#sos').onclick=()=>go('emerg');
$('#enter').onclick=()=>enter(true);$('#skip').onclick=()=>enter(false);
$('#fn').value=S.name;$('#fc').value=S.chalet;
welcomeText();render();
</script>
</body>
</html>
