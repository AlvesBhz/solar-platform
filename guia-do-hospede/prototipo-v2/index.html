<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Guia do Hóspede · Protótipo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../design-system/colors_and_type.css"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--c-s100);font-family:var(--font-sans);color:var(--fg-1);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--c-cream);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){.app{height:min(900px,96dvh);margin-top:2dvh;border-radius:32px;box-shadow:var(--shadow-xl);border:1px solid var(--c-s200)}}
/* header */
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;background:var(--c-cream);min-height:60px}
.top .ttl{flex:1;font-family:var(--font-serif);font-weight:500;font-size:24px;letter-spacing:-.01em;line-height:1.1}
.ib{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--c-pine)}
.ib:active{background:var(--c-s200)}
.lang{display:flex;gap:2px;background:var(--c-s100);border-radius:var(--r-pill);padding:3px}
.lang button{font-size:11px;font-weight:600;letter-spacing:.08em;padding:6px 9px;border-radius:var(--r-pill);color:var(--fg-3)}
.lang button.on{background:var(--c-pine);color:#fff}
/* main */
main{flex:1;overflow-y:auto;padding:4px 16px 120px;scroll-behavior:smooth}
main::-webkit-scrollbar{width:0}
.sec{margin-top:22px}
.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
h2.h{font-family:var(--font-serif);font-weight:500;font-size:30px;line-height:1.05;letter-spacing:-.02em}
h2.h em{font-family:var(--font-italic);font-style:italic;font-weight:400}
p.sub{color:var(--fg-2);font-size:14px;margin-top:6px}
/* cards */
.card{background:#fff;border:1px solid var(--c-s200);border-radius:var(--r-xl);padding:16px;box-shadow:var(--shadow-sm)}
.card+.card{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:112px;padding:16px;text-align:left;background:#fff;border:1px solid var(--c-s200);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);transition:transform var(--dur-fast),box-shadow var(--dur-base)}
.tile:active{transform:scale(.98)}
.tile .ic{width:44px;height:44px;border-radius:var(--r-lg);background:var(--c-s100);color:var(--c-pine);display:grid;place-items:center}
.tile b{font-weight:600;font-size:15px;line-height:1.2}
.tile small{display:block;font-weight:400;font-size:12px;color:var(--fg-3);margin-top:2px}
.tile.dark{background:var(--c-pine);color:#fff;border-color:var(--c-pine)}
.tile.dark .ic{background:rgba(255,255,255,.12);color:#fff}
.tile.dark small{color:rgba(255,255,255,.7)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:#fff;border:1px solid var(--c-s200);border-radius:var(--r-xl);text-align:left;min-height:64px}
.row+.row{margin-top:10px}
.row .ic{flex:none;width:40px;height:40px;border-radius:var(--r-md);background:var(--c-s100);color:var(--c-pine);display:grid;place-items:center}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600}
.row .tx span{display:block;font-size:13px;color:var(--fg-3)}
.row .go{color:var(--fg-4)}
/* hero card */
.hero{position:relative;border-radius:var(--r-2xl);overflow:hidden;padding:22px;color:#fff;background:linear-gradient(160deg,var(--c-pine-deep),var(--c-pine) 55%,var(--c-pine-mid))}
.hero .gr{font-family:var(--font-serif);font-size:32px;font-weight:500;line-height:1}
.hero .gr em{font-family:var(--font-italic);font-weight:400}
.hero p{color:rgba(255,255,255,.75);font-size:13px;margin-top:6px}
.hero .times{display:flex;gap:10px;margin-top:18px}
.hero .t{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--r-lg);padding:10px 12px}
.hero .t small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hero .t b{font-family:var(--font-mono);font-size:18px;font-weight:500}
/* wifi */
.wifi{display:flex;align-items:center;gap:14px}
.wifi .big{font-family:var(--font-mono);font-size:19px;font-weight:600;letter-spacing:.02em;word-break:break-all}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--r-pill);background:var(--c-pine);color:#fff;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:transform var(--dur-base),background var(--dur-base)}
.btn:active{transform:translateY(1px);background:var(--c-pine-deep)}
.btn.out{background:#fff;color:var(--c-pine);border:1px solid var(--c-pine)}
.btn.red{background:var(--c-error)}
.btn.full{width:100%}
.btns{display:grid;gap:10px;margin-top:14px}
/* chips + badges */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:var(--r-pill);background:#fff;border:1px solid var(--c-s300);font-size:13px;font-weight:500;color:var(--fg-2)}
.chip.on{background:var(--c-pine);border-color:var(--c-pine);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:var(--r-pill);border:1px solid}
.b-leve{color:var(--c-available);border-color:#a7d9c5;background:#ecfdf5}
.b-media{color:var(--c-warning);border-color:#f3d9a6;background:var(--c-warning-bg)}
.b-exig{color:var(--c-error);border-color:#f0b8b8;background:#fef2f2}
.meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:13px;color:var(--fg-2)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.place h3{font-family:var(--font-serif);font-size:22px;font-weight:500;line-height:1.1;margin:8px 0 4px}
.place p{font-size:14px;color:var(--fg-2)}
.pend{display:inline-block;font-size:11px;font-weight:600;color:var(--c-warning);background:var(--c-warning-bg);border:1px solid #f3d9a6;border-radius:var(--r-sm);padding:1px 7px}
/* search */
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:#fff;border:1px solid var(--c-s300);border-radius:var(--r-pill);color:var(--fg-3)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;color:var(--fg-1);min-width:0}
.plan{margin-top:14px;aspect-ratio:16/10;border-radius:var(--r-xl);border:1.5px dashed var(--c-s300);background:var(--c-s100);display:grid;place-items:center;text-align:center;color:var(--fg-3);font-size:13px;padding:16px}
.steps{counter-reset:s;list-style:none;margin-top:12px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;padding:10px 0;font-size:17px;line-height:1.35}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:var(--r-pill);background:var(--c-pine);color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;margin-top:-1px}
.call{background:#fef2f2;border:1px solid #f0b8b8;color:var(--c-error);border-radius:var(--r-lg);padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.dont{background:#fff;border:1px solid var(--c-s200);border-left:4px solid var(--c-error);border-radius:var(--r-lg);padding:14px 16px;margin-top:14px}
.dont b{display:flex;align-items:center;gap:8px;color:var(--c-error);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.dont li{margin-left:18px;font-size:15px;line-height:1.4;margin-top:4px}
.fixbar{position:absolute;left:0;right:0;bottom:78px;padding:10px 16px;background:linear-gradient(to top,var(--c-cream) 70%,transparent);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sosgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.call-row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-xl);background:var(--c-error);color:#fff;min-height:68px}
.call-row+.call-row{margin-top:10px}
.call-row.s{background:#fff;color:var(--c-error);border:1px solid #f0b8b8}
.call-row b{display:block;font-size:20px;font-family:var(--font-mono)}
.call-row span{font-size:13px;opacity:.9}
.disc{margin-top:18px;font-size:12px;color:var(--fg-3);line-height:1.5;display:flex;gap:8px}
/* tab bar + SOS */
nav.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(250,250,249,.94);backdrop-filter:blur(14px);border-top:1px solid var(--c-s200)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg-3);font-size:11px;font-weight:500;border-radius:var(--r-lg)}
.tab.on{color:var(--c-pine);font-weight:700}
.tab.on iconify-icon{transform:translateY(-1px)}
.sos{position:absolute;right:16px;bottom:94px;z-index:5;display:flex;align-items:center;gap:8px;height:52px;padding:0 20px;border-radius:var(--r-pill);background:var(--c-error);color:#fff;font-weight:700;font-size:14px;letter-spacing:.12em;box-shadow:var(--shadow-lg)}
.sos:active{transform:scale(.97)}
.hasfix .sos{display:none}
.toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,20px);opacity:0;background:var(--c-pine-deep);color:#fff;padding:12px 18px;border-radius:var(--r-pill);font-size:13px;pointer-events:none;transition:all var(--dur-base);z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* welcome */
.welcome{position:absolute;inset:0;z-index:30;background:linear-gradient(170deg,var(--c-pine-deep),var(--c-pine) 60%,var(--c-pine-mid));color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:40px 28px 36px;transition:opacity var(--dur-slow),visibility var(--dur-slow)}
.welcome.off{opacity:0;visibility:hidden}
.welcome .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-size:24px;font-weight:500}
.welcome h1{font-family:var(--font-serif);font-weight:500;font-size:52px;line-height:.92;letter-spacing:-.03em}
.welcome h1 em{font-family:var(--font-italic);font-weight:400}
.welcome p{color:rgba(255,255,255,.75);margin-top:14px;max-width:30ch}
.welcome .btn{background:#fff;color:var(--c-pine-deep)}
.welcome .lang{background:rgba(255,255,255,.12);align-self:flex-start;margin-bottom:22px}
.welcome .lang button{color:rgba(255,255,255,.7)}
.welcome .lang button.on{background:#fff;color:var(--c-pine-deep)}
.fade{animation:fadeUp var(--dur-slow) var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
.proto{margin-top:26px;font-size:11px;color:var(--fg-4);text-align:center}
</style>
</head>

 <div class="sec" style="margin-top:14px">
  ${GUIDE.emergencyNational.map((e,i)=>`<a class="call-row ${i?'s':''}" href="tel:${e.tel}">${ico(e.icon,28)}<div style="flex:1"><b>${e.tel}</b><span>${e.label}</span></div>${ico('solar:phone-calling-linear',24)}</a>`).join('')}
 </div>
 <div class="card sec" style="margin-top:18px"><div class="lbl">${t('myAddr')}</div><p style="font-size:17px;font-weight:600;margin-top:4px;line-height:1.35">${P.address}</p><p class="sub">${t('addrHint')}</p>
  <div class="btns"><button class="btn out full" onclick="copy('${P.address.replace(/'/g,"\\'")}',t('addrCopied'))">${ico('solar:copy-linear',20)}${t('copyAddr')}</button></div></div>
 <div class="sec"><div class="eyebrow">${t('nearHelp')}</div>${PL.saude.slice(0,2).map(p=>`<div class="card place"><h3>${p.title}</h3><p>${p.text}</p><div class="meta">${(p.meta||[]).map(m=>`<span>${ico(m.icon,16)}${m.text}</span>`).join('')}</div></div>`).join('')}</div>`;

V.fa=()=>`<p class="sub" style="margin-top:0">${t('faPick')}</p><div class="sosgrid sec" style="margin-top:14px">
 ${FA_ORDER.map(k=>`<button class="tile" onclick="${FA[k]?`go('fadet','${k}')`:`toast('${t('soon')}')`}" style="min-height:104px"><span class="ic">${ico((FA[k]||{}).ic||FA_ICON[k])}</span><b>${t(k)}</b></button>`).join('')}</div>
 <p class="disc">${ico('solar:info-circle-linear',18)}<span>${t('disc')}</span></p>`;

function fadet(k){const d=FA[k][lang];return `<div class="call">${ico('solar:phone-calling-linear',22)}<span>${t('callIf')}: ${d.call}</span></div>
 <ol class="steps">${d.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
 <div class="dont"><b>${ico('solar:close-circle-linear',18)}${t('dont')}</b><ul>${d.dont.map(s=>`<li>${s}</li>`).join('')}</ul></div>
 <p class="disc">${ico('solar:info-circle-linear',18)}<span>${t('draft')}</span></p>
 <div class="fixbar"><a class="btn red" href="tel:192">${ico('solar:phone-calling-linear',20)}${t('call')} 192</a><button class="btn out" onclick="go('emerg')">${t('myAddr')}</button></div>`}

/* ───────── render ───────── */
const TITLES={home:null,casa:'tCasa',serra:'tSerra',sabores:'tSabores',ajuda:'tAjuda',wifi:'wifi',digital:'ckT',where:'where',auto:'auto',emerg:'emT',fa:'faT'};
function render(){
  const cur=stack[stack.length-1],[id,arg]=cur.split(':'),isSub=stack.length>1;
  const active=PARENT[id]||id;
  const title=id==='fadet'?t(arg):id==='home'?null:t(TITLES[id]);
  $('#top').innerHTML=(isSub?`<button class="ib" onclick="back()" aria-label="${t('back')}">${ico('solar:alt-arrow-left-linear',26)}</button>`:`<span class="ib">${ico('solar:leaf-linear',26)}</span>`)
   +`<div class="ttl">${title||'Solar do Espinhaço'}</div><div class="lang">${['pt','en','es'].map(l=>`<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}</div>`;
  $('#main').innerHTML=id==='fadet'?fadet(arg):V[id]();
  $('#main').scrollTop=0;
  if(id==='where')fill();
  $('#tabs').innerHTML=TABS.map(x=>`<button class="tab ${x[0]===active?'on':''}" onclick="tab('${x[0]}')">${ico(x[2],26)}<span>${t(x[1])}</span></button>`).join('');
  $('#app').classList.toggle('hasfix',id==='fadet');
  document.documentElement.lang={pt:'pt-BR',en:'en',es:'es'}[lang];
}
function setLang(l){lang=l;try{localStorage.setItem('gl',l)}catch(e){};welcomeText();render()}
function welcomeText(){$('#wh').innerHTML=t('welcomeH');$('#wp').textContent=t('welcomeP');$('#enter').textContent=t('enter');
 $('#wlang').innerHTML=['pt','en','es'].map(l=>`<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}
$('#sos').onclick=()=>go('emerg');
$('#enter').onclick=()=>$('#welcome').classList.add('off');
welcomeText();render();
</script>
</body>
</html>
